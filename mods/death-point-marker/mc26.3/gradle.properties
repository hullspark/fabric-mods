# Real, non-obfuscated version strings, checked against
# https://meta.fabricmc.net/v2/versions/loader/26.3 (loader) and
# https://api.modrinth.com/v2/project/fabric-api/version?game_versions=["26.3"]
# (fabric-api) on 2026-10-01. No Yarn mapping: 26.x ships unobfuscated, so
# this project uses the new no-remap net.fabricmc.fabric-loom plugin and
# has no `mappings` dependency (see build.gradle).
minecraft_version=26.3
loader_version=0.19.5

# Mod properties
# +mc26.3 suffix (qa-reviewer finding): this is an unverified rebuild for a
# different Minecraft version, not the published 0.1.2 jar, and the file
# name/version string must not be confusable with it.
mod_version=0.1.2+mc26.3
maven_group=com.hullspark
archives_base_name=death-point-marker

# Dependencies
fabric_version=0.161.0+26.3

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom 1.18.2 itself requires a Java 25 JVM to run (not just to compile
# against). gradle/gradle-daemon-jvm.properties pins the daemon to 25 in a
# way Gradle can satisfy on any machine (auto-detect an installed JDK 25,
# or download one via the foojay toolchain resolver declared in
# settings.gradle) instead of a sandbox-only org.gradle.java.home path.
# This hint just saves this specific container a download since it
# already has one installed; it's harmless if the path doesn't exist
# elsewhere. This is scoped to this mc26.3/ project only (its own
# gradlew/daemon); the 1.21.11 project one directory up is unaffected.
org.gradle.java.installations.paths=/usr/lib/jvm/java-25-openjdk-amd64
